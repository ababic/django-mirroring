# See https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/
name: Publish to PyPI

on:
  release:
    types: [published]

permissions: {}

jobs:
  test:
    uses: ./.github/workflows/test.yml
    permissions: {}
  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: false
      - run: uv build
      - run: uv run --isolated --no-project --with dist/*.whl pytest
      - run: uv run --isolated --no-project --with dist/*.tar.gz pytest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: ./dist
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: none
      id-token: write
    # No GitHub Environment required — configure PyPI Trusted Publisher with
    # Environment name left blank (Owner: ababic, Repo: django-mirroring,
    # Workflow: publish.yml). Re-add `environment: pypi` once that env exists
    # on the repo and matches the publisher config.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: artifact/
          print-hash: true
