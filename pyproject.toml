[project]
name = "django-mirroring"
version = "0.2.4"
description = "Django add-on for production database mirror refresh and staging restore (Dumpling + Postgres shadow cutover)"
readme = "README.md"
license = "MIT"
authors = [{name = "Andy Babic", email = "andy@wearecrew.com"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: Django",
    "Framework :: Django :: 6.0",
]
requires-python = ">=3.12"
dependencies = [
    "Django~=6.0.0",
    "dj-database-url~=2.2.0",
    "python-dateutil~=2.9.0",
    "dumpling-cli~=0.9.0",
    "boto3>=1.42,<1.44",
]

[project.urls]
Homepage = "https://github.com/ababic/django-mirroring"
Repository = "https://github.com/ababic/django-mirroring"
Changelog = "https://github.com/ababic/django-mirroring/blob/main/CHANGELOG.md"
Documentation = "https://github.com/ababic/django-mirroring#readme"
Issues = "https://github.com/ababic/django-mirroring/issues"

[dependency-groups]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.9",
]

[build-system]
requires = ["uv_build>=0.11.19,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "mirroring"
source-exclude = [
    "mirroring/test",
    ".*",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "mirroring.test.settings"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "unit: fast isolated tests",
    "django_db: requires database access",
]
